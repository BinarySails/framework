name: Setup
description: Set up environment

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - uses: actions/setup-node@v3
      with:
        node-version: 16

    - uses: actions/cache@v3
      id: cache
      with:
        path: "**/node_modules"
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}

    - shell: bash
      run: bun install
